# golangci-lint v2 (the release mise.toml pins). The standard linters, gofmt
# with simplification, and errcheck relaxed in tests (core's frostyard-go-repo
# skill). make lint runs it in each module of go.work.
version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # ADR-0004: service/pig is the only package that imports PiG, so a PiG
        # API change lands in one place.
        pig-boundary:
          files:
            - "$all"
            - "!**/service/pig/**"
          deny:
            - pkg: "github.com/MichaelKinsy/PiG"
              desc: "only service/pig imports PiG (ADR-0004)"
        # ADR-0010: the desktop's data layer and state import no UI, so a
        # phone client can reuse them. Its tests may use frostuitest, which
        # imports only the standard library.
        desktop-state-boundary:
          files:
            - "**/desktop/internal/state/**"
            - "**/desktop/internal/pocketdtest/**"
            - "!$test"
          deny:
            - pkg: "github.com/egoist/mygo"
              desc: "desktop/internal/state holds no UI (ADR-0010): views live in desktop/internal/app"
            - pkg: "github.com/frostyard/frostui"
              desc: "desktop/internal/state holds no UI (ADR-0010): views live in desktop/internal/app"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
