name: PocketGo release candidate

on:
  workflow_dispatch:
    inputs:
      publish_rc:
        description: Publish the attested Flatpak to the rc OCI tag
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.work
      - name: Install the Flatpak build runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Sdk//51 org.gnome.Platform//51
      - run: make rc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pocketgo-rc-${{ github.sha }}
          path: build/rc/pocketgo-*/*
          if-no-files-found: error
  publish:
    needs: build
    if: inputs.publish_rc && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: pocketgo-flatpak-rc
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pocketgo-rc-${{ github.sha }}
      - name: Export the verified bundle as OCI
        run: |
          sha256sum -c SHA256SUMS
          test "$(cat revision.txt)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install -y flatpak ostree skopeo
          ostree init --mode=archive-z2 --repo=repo
          flatpak build-import-bundle repo *.flatpak
          flatpak build-bundle --oci repo image org.frostyard.PocketGo rc
      - name: Push the commit tag
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --format oci --digestfile digest oci:image docker://ghcr.io/frostyard/pocketgo:sha-"$GITHUB_SHA"
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/frostyard/pocketgo
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Promote the attested candidate to rc
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: skopeo copy --preserve-digests "docker://ghcr.io/frostyard/pocketgo@$DIGEST" docker://ghcr.io/frostyard/pocketgo:rc
