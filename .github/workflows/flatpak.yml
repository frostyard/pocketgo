name: PocketGo release candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/flatpak.yml'
      - 'packaging/**'
      - 'desktop/**'
      - 'proto/**'
      - 'go.work*'
      - 'Makefile'
  push:
    tags: ['v[0-9]*-rc.[0-9]*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Install the Flatpak build runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Sdk//51 org.gnome.Platform//51
      - name: Build the paired candidates
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export POCKETGO_RC_VERSION="${GITHUB_REF_NAME#v}"
          fi
          make rc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pocketgo-rc-${{ github.sha }}
          path: build/rc/
          if-no-files-found: error
  export:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pocketgo-rc-${{ github.sha }}
          path: candidates
      - name: Verify the downloaded pair and export its Flatpak as OCI
        run: |
          candidates=(candidates/pocketgo-*)
          test "${#candidates[@]}" -eq 1
          cd "${candidates[0]}"
          sha256sum -c SHA256SUMS
          test "$(cat revision.txt)" = "$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test -f "pocketgo-${GITHUB_REF_NAME#v}-${GITHUB_SHA::12}-x86_64.flatpak"
          fi
          sudo apt-get update
          sudo apt-get install -y flatpak ostree
          ostree init --mode=archive-z2 --repo=repo
          flatpak build-import-bundle repo ./*.flatpak
          flatpak build-bundle --oci repo "$GITHUB_WORKSPACE/image" org.frostyard.PocketGo stable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: pocketgo-oci-${{ github.sha }}
          path: image/
          if-no-files-found: error

  publish:
    needs: export
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    concurrency: pocketgo-flatpak-rc
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: image
          name: pocketgo-oci-${{ github.sha }}
      - name: Push the release candidate
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --format oci --digestfile digest oci:image "docker://ghcr.io/frostyard/pocketgo:$GITHUB_REF_NAME"
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/frostyard/pocketgo
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
