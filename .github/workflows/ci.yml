# CI workflow (ADR-0021: SHA-pinned actions, least privilege): the job verify
# is the required check. Actions use full commit SHA pins, the token has only
# contents read, and checkout does not persist credentials.
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  merge_group: {}

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Go comes from go.work's go line, the only Go pin.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          # The cache key covers the workspace and every module file, so it
          # holds while a module has no go.sum yet.
          cache-dependency-path: |
            go.work
            **/go.mod
            **/go.sum
      # golangci-lint and Node come from mise.toml and mise.lock (ADR-0043),
      # checksum-verified, the same way a developer's `mise install` does.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          install_args: golangci-lint node
          cache: true
      # make ci runs every Go gate in each module of go.work, then the race
      # detector and the cross-build of each module's targets.
      - run: make ci BASE="$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
