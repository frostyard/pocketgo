# Tool pins for this repository (frostyard core ADR-0043). Every tool the gates
# invoke is listed; mise.lock carries the checksums. `mise install` provisions
# the same versions locally and in CI. Go comes from the go line of go.work and
# each module's go.mod, the only Go pin; never pin it here.
[settings]
lockfile = true

[tools]
# The pinned lint of make verify; the fleet version (core's frostyard-go-repo
# skill, Fleet toolchain).
golangci-lint = "2.15.0"
# The template gate (make verify) runs scripts/check-template.mjs and the Node
# tests. Node 24 LTS.
node = "24.22.2"
